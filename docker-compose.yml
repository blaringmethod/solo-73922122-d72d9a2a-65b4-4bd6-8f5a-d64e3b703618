services:
  bus-position-partition:
    build: .
    image: bus-position-partition:1.0.0
    container_name: bus-position-partition
    ports:
      - "8000:8000"
    environment:
      # 数据根目录（容器内），挂载到命名卷，重启保留已提交数据
      BUS_DATA_DIR: /data
      BUS_MAX_BATCH_RECORDS: "1000"
      BUS_LEASE_TTL_SECONDS: "120"
      BUS_REAP_GRACE_SECONDS: "30"
    volumes:
      - bus-position-data:/data
    restart: unless-stopped
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3).status == 200 else 1)"
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

volumes:
  bus-position-data:
